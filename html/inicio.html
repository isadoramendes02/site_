<button id="btnMusica">▶️ Tocar Música</button>

    <script>
    // 1. Obtém os elementos pelo ID
    const musica = document.getElementById('minhaMusica');
    const btnMusica = document.getElementById('btnMusica');

    // 2. Define a função de play/pause
    function togglePlayPause() {
        if (musica.paused) {
            musica.play();
            btnMusica.textContent = '⏸️ Pausar Música';
        } else {
            musica.pause();
            btnMusica.textContent = '▶️ Tocar Música';
        }
    }

    // 3. Adiciona o evento de clique ao botão
    btnMusica.addEventListener('click', togglePlayPause);
</script>
