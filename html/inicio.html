<audio id="musica" src="music/winx.mp3" loop></audio>

<button id="btnMusica">🎶</button>

<script>
const musica = document.getElementById('musica');
const btn = document.getElementById('btnMusica');

btn.onclick = () => {
    if (musica.paused) {
        musica.play();
        btn.textContent = "🔊";
    } else {
        musica.pause();
        btn.textContent = "🎶";
    }
};
</script>
