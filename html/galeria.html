    <!-- Musica -->
    <audio id="minhaMusica" loop>
        <source src="music/winx.mp3" type="audio/mpeg">
        Seu navegador não suporta o elemento de áudio.
    </audio>
    <button id="btnMusica"> 🎶 </button>
    <!-- Fim Musica -->

    <script>
        // os elementos pelo ID
        const musica = document.getElementById('minhaMusica');
        const btnMusica = document.getElementById('btnMusica');

        // Define a função de play/pause
        function togglePlayPause() {
            if (musica.paused) {
                musica.play();
                btnMusica.textContent = ' 🎶 ';
            } else {
                musica.pause();
                btnMusica.textContent = ' 🎶';
            }
        }

        // Adiciona o evento de clique ao botão
        btnMusica.addEventListener('click', togglePlayPause);
    </script> 
    <script>
    // Seleciona o ícone de clique
    const menuIcon = document.querySelector(".menu-icon");
    // Seleciona o menu que será aberto/fechado
    const menuUl = document.querySelector(".ul"); 

    if (menuIcon && menuUl) {
        menuIcon.addEventListener("click", () => {
            // Esta função faz o "toggle" (alternar):
            // 1. Se tem a classe 'active', ela REMOVE (fecha).
            // 2. Se não tem a classe 'active', ela ADICIONA (abre).
            menuUl.classList.toggle("active");
        });
    }
</script>
